<style>

:root {
  --bg:#090c11; --panel:#11161e; --panel2:#151c25; --line:#242c37;
  --text:#f4f7fa; --muted:#8994a3; --muted2:#b7c0cc;
  --acid:#c9ff50; --green:#67dfa0; --cyan:#5ddce5; --blue:#7f91ff;
  --violet:#b783f7; --amber:#f5c665; --red:#f37a86;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit}
button{color:inherit}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.sidebar{padding:22px 14px;border-right:1px solid var(--line);background:#0b0f15}
.brand{padding:4px 10px 24px}
.brand b{display:block;font-size:13px;letter-spacing:.08em}
.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.nav{display:grid;gap:6px}
.nav button{border:0;border-radius:10px;background:transparent;color:var(--muted2);padding:11px 12px;text-align:left;cursor:pointer}
.nav button.active{background:#151c25;color:var(--acid)}
.main{min-width:0}
.topbar{padding:16px 26px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.content{max-width:1500px;margin:0 auto;padding:26px}
.view{display:none}
.view.active{display:block}
.hero{margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acid);font-weight:700}
.hero h1{font-size:32px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.035em}
.hero p{font-size:13px;line-height:1.5;color:var(--muted);margin:0;max-width:850px}

.kpi-grid{display:grid;grid-template-columns:minmax(330px,1.5fr) repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.card,.kpi{border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.kpi{padding:16px;min-height:132px}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi-value{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:15px}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:6px}
.overall-kpi{padding:16px}
.overall-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px}
.overall-number{font-size:34px;font-weight:850;letter-spacing:-.055em;line-height:1}
.overall-note{font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
.contrib{display:grid;gap:8px;margin-top:14px}
.contrib-row{display:grid;grid-template-columns:118px minmax(0,1fr) 80px;gap:8px;align-items:center}
.contrib-row span{font-size:11px;color:var(--muted2)}
.contrib-track{height:8px;background:#202833;border-radius:999px;overflow:hidden}
.contrib-track i{display:block;height:100%;border-radius:999px}
.contrib-row b{font-size:12px;text-align:right}
.formula-line{font-size:10px;color:var(--muted);margin-top:10px}

.pulse-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(500px,.95fr);gap:12px}
.card{padding:18px}
.results-grid>.card{min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{font-size:16px;margin:0}
.card-head p{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.4}
.pill{font-size:11px;color:var(--muted2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:nowrap}
.status-summary{display:flex;justify-content:space-between;gap:20px;margin-bottom:13px}
.status-summary span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.status-summary b{display:block;font-size:28px;margin-top:4px}
.status-summary small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.status-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.status-card{border:1px solid var(--line);background:#0e141c;border-radius:12px;padding:12px;text-align:left;cursor:pointer;min-width:0}
.status-card:hover{border-color:#3a4656}
.status-name{display:block;font-size:11px;line-height:1.25;color:var(--muted2);min-height:30px}
.status-name i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.status-card strong{display:block;font-size:22px;margin-top:8px}
.status-money{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.status-breakdown{display:block;font-size:10px;color:var(--muted2);margin-top:7px;line-height:1.45;border-top:1px solid var(--line);padding-top:7px}
.status-work i{background:var(--green)} .status-closing i{background:var(--amber)}
.status-closed i{background:#7e8998} .status-risk i{background:var(--red)} .status-opp i{background:var(--violet)} .status-wait i{background:var(--cyan)} .status-paused i{background:#d3a564}

.chart-wrap{overflow:hidden}
.cashflow-svg{display:block;width:100%;height:auto;min-height:270px}
.gridline{stroke:#202833;stroke-width:1}
.year-sep{stroke:#3a4350;stroke-dasharray:4 5}
.bar-fact{fill:var(--acid)}
.bar-forecast{fill:var(--blue);fill-opacity:.48;stroke:#a8b2ff;stroke-width:1;stroke-dasharray:4 3}
.axis-label,.year-label{fill:#7e8998;font-size:11px}
.quarter-label{fill:#b7c0cc;font-size:12px;font-weight:600}
.fact-value{fill:#f2f6f9;font-size:11px;font-weight:700}
.forecast-value{fill:#b8c0ff;font-size:10px;font-weight:700}
.total-value{fill:#98a4b4;font-size:10px}
.trend-line{fill:none;stroke:#ffffff;stroke-width:1.8;stroke-dasharray:7 6;opacity:.58}
.trend-label{fill:#cbd2dc;font-size:10px;font-weight:700}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px}

.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.summary-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px}
.summary-card span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.summary-card b{display:block;font-size:23px;margin-top:8px}
.summary-card small{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;align-items:stretch}
.matrix{display:grid;grid-template-columns:110px repeat(4,1fr);gap:7px}
.matrix-head{font-size:11px;color:var(--muted);text-align:center;padding:4px}
.matrix-label{border:1px solid var(--line);border-radius:10px;padding:11px;font-size:12px}
.matrix-cell{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:88px}
.matrix-cell b{font-size:15px}
.matrix-cell span{display:block;font-size:10px;color:var(--muted);margin-top:5px}
.matrix-base{display:block;font-size:9px!important;color:var(--muted2)!important;line-height:1.3;margin-top:6px!important;font-weight:600}
.matrix-cell{min-height:88px}
.matrix-cell.future{opacity:.5}
.m-acid{box-shadow:inset 0 2px 0 rgba(201,255,80,.45)}
.m-violet{box-shadow:inset 0 2px 0 rgba(183,131,247,.45)}
.m-cyan{box-shadow:inset 0 2px 0 rgba(93,220,229,.45)}
.quarter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.compare-wrap{margin-top:13px;overflow:hidden}
.compare-svg{display:block;width:100%;height:auto;min-height:220px}
.bar-plan{fill:#697484;opacity:.55}
.bar-contract-fact{fill:var(--violet)}
.compare-plan-label{fill:#a3adba;font-size:10px;font-weight:700}
.compare-fact-label{fill:#f3f6fa;font-size:10px;font-weight:800}
.compare-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:2px}
.compare-legend i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px}
.quarter-card{border:1px solid var(--line);border-radius:11px;padding:11px;background:#0e141c}
.quarter-card>span{font-size:11px;color:var(--muted)}
.quarter-card b{display:block;font-size:13px;margin-top:5px}
.quarter-card small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}






.contract-toolbar{display:grid;gap:10px;margin-bottom:12px}
.scope-row,.quick-row,.filter-row{display:flex;gap:7px;flex-wrap:wrap}
.scope-row button,.quick-row button,.filter-row button,.filter-row select,.filter-row input{min-height:38px;border:1px solid var(--line);background:var(--panel2);color:var(--text2);border-radius:9px;padding:8px 10px;font-size:12px}
.scope-row button,.quick-row button,.filter-row button{cursor:pointer}
.scope-row button.active,.quick-row button.active{color:var(--acid);border-color:#5a6f3b;background:#151d14}
.filter-row input{flex:1;min-width:240px}
.registry-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.registry-stat{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--panel)}
.registry-stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
.registry-stat b{display:block;font-size:17px;margin-top:4px}
.registry-table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1020px}
th{background:#101720;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:11px;text-align:left;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{font-size:12px;padding:10px 11px;border-bottom:1px solid #1b222c;color:#cbd2dc;vertical-align:middle}
tbody tr:hover{background:#121923}
.money{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:5px 7px;border-radius:7px;font-size:10px;white-space:nowrap}
.b-active{background:#11221a;color:#81e7aa} .b-wait{background:#112126;color:#8ce0e7}
.b-closing{background:#282114;color:#f0ca77} .b-closed{background:#1b2027;color:#aab3bf}
.b-risk{background:#2a171a;color:#f58d97} .b-opp{background:#23182b;color:#d5a9ff} .b-sub{background:#171d2d;color:#aeb8ff}
.type-badge{display:inline-block;padding:5px 7px;border-radius:7px;font-size:10px;font-weight:700;white-space:nowrap}
.type-ts{background:#102329;color:#85e5ec}.type-podd{background:#171d31;color:#aeb8ff}.type-other{background:#251a2c;color:#d8b2ff}
.registry-cards{display:none}
.registry-card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:14px}
.registry-card+.registry-card{margin-top:8px}
.registry-card h3{font-size:15px;margin:0 0 7px}
.registry-card .meta{font-size:12px;color:var(--muted);line-height:1.45}
.registry-card .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #202833;font-size:12px}
.registry-card .row span{color:var(--muted)}
.registry-card details{margin-top:8px}
.registry-card summary{cursor:pointer;color:var(--muted2);font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.detail-panel{display:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;margin-bottom:10px}
.detail-panel.show{display:block}
.detail-panel h3{margin:5px 0 8px;font-size:18px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.detail-grid div{border:1px solid var(--line);border-radius:9px;padding:9px}
.detail-grid span{display:block;font-size:10px;color:var(--muted)}
.detail-grid b{display:block;font-size:12px;margin-top:4px}


#view-contracts{position:relative;overflow:hidden;isolation:isolate}
#view-contracts.easter-active::before{content:"";position:absolute;inset:0;background-image:var(--podd-easter-image);background-size:cover;background-position:center top;background-repeat:no-repeat;opacity:.82;pointer-events:none;z-index:0;filter:saturate(1.14) contrast(1.12) brightness(1.03)}
#view-contracts.easter-active::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,12,17,.18),rgba(9,12,17,.08) 28%,rgba(9,12,17,.16) 100%);pointer-events:none;z-index:0}
#view-contracts.easter-active > *{position:relative;z-index:1}

#view-contracts.easter-active .contract-toolbar,
#view-contracts.easter-active .registry-stat,
#view-contracts.easter-active .registry-table-wrap,
#view-contracts.easter-active .registry-card,
#view-contracts.easter-active .detail-panel{
  background:rgba(14,19,27,.56);
  backdrop-filter:none;
}
#view-contracts.easter-active table thead{
  background:rgba(16,23,32,.72);
}
#view-contracts.easter-active tbody tr:hover{
  background:rgba(18,25,35,.58);
}
#view-contracts.easter-active .hero{
  text-shadow:0 2px 12px rgba(0,0,0,.9);
}

#view-contracts.easter-active .registry-stat,
#view-contracts.easter-active .registry-card,
#view-contracts.easter-active .detail-panel,
#view-contracts.easter-active .contract-toolbar,
#view-contracts.easter-active .registry-table-wrap{
  box-shadow:0 8px 30px rgba(0,0,0,.16);
}


@media(max-width:720px){
  #view-contracts.easter-active::before{background-position:center 12%;opacity:.68}
  #view-contracts.easter-active::after{background:linear-gradient(180deg,rgba(9,12,17,.24),rgba(9,12,17,.15) 34%,rgba(9,12,17,.22) 100%)}
}

.mobile-nav{display:none}

.theme-picker{
  flex:0 0 auto;

/* === Annual progress switch chart === */
.annual-progress-card{margin-top:14px}
.annual-progress-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:12px;
}
.annual-progress-header h2{margin:0;font-size:20px}
.annual-progress-header p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.annual-progress-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
}
.annual-progress-toggle{
  display:inline-flex;
  gap:3px;
  padding:3px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel2);
}
.annual-progress-toggle button{
  min-height:34px;
  padding:0 13px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:var(--muted2);
  font-size:12px;
  font-weight:750;
  cursor:pointer;
}
.annual-progress-toggle button:hover{color:var(--text)}
.annual-progress-toggle button.active,
.annual-progress-toggle button[aria-pressed="true"]{
  background:var(--panel);
  color:var(--text);
  box-shadow:0 3px 10px rgba(0,0,0,.13);
}
.annual-progress-stage{position:relative}
.annual-progress-panel{display:none;--progress-color:var(--green)}
.annual-progress-panel.active{display:block}
.annual-progress-panel.contracting{--progress-color:var(--violet)}
.annual-progress-frame{
  position:relative;
  overflow-x:auto;
  overflow-y:visible;
}
.annual-progress-svg{
  display:block;
  width:100%;
  height:auto;
  min-height:360px;
}
.annual-progress-grid{stroke:var(--line);stroke-width:1;opacity:.72}
.annual-progress-axis,.annual-progress-unit{
  fill:var(--muted);
  font-size:12px;
}
.annual-progress-quarter{
  fill:var(--muted2);
  font-size:13px;
  font-weight:700;
}
.annual-progress-plan-line{
  stroke:var(--blue);
  stroke-width:2;
  stroke-dasharray:7 7;
  opacity:.72;
}
.annual-progress-plan-label{
  fill:var(--muted2);
  font-size:11px;
  font-weight:700;
}
.annual-progress-line{
  fill:none;
  stroke:var(--progress-color);
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.annual-progress-area-start{
  stop-color:var(--progress-color);
  stop-opacity:.24;
}
.annual-progress-area-end{
  stop-color:var(--progress-color);
  stop-opacity:.025;
}
.annual-progress-point{
  fill:var(--panel);
  stroke:var(--progress-color);
  stroke-width:3;
}
.annual-progress-hover-line{
  display:none;
  stroke:var(--progress-color);
  stroke-width:1.6;
  stroke-dasharray:5 6;
  opacity:.55;
}
.annual-progress-panel.hovering .annual-progress-hover-line{display:block}
.annual-hover-zone{
  fill:transparent;
  cursor:pointer;
}
.annual-progress-tooltip{
  position:absolute;
  top:18px;
  left:0;
  min-width:168px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  box-shadow:0 14px 34px rgba(0,0,0,.16);
  color:var(--text);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-6px);
  transition:opacity .14s ease, transform .14s ease;
  z-index:3;
}
.annual-progress-panel.hovering .annual-progress-tooltip{
  opacity:1;
  transform:translate(-50%,0);
}
.annual-progress-tooltip-quarter{
  font-size:12px;
  font-weight:800;
  margin-bottom:8px;
}
.annual-progress-tooltip-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  font-size:12px;
  line-height:1.5;
}
.annual-progress-tooltip-row span{color:var(--muted)}
.annual-progress-tooltip-row b{font-size:12px}
.annual-progress-footnote{
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}
html[data-theme="light"] .annual-progress-toggle,
html[data-theme="corporate"] .annual-progress-toggle{background:var(--panel2)}
html[data-theme="light"] .annual-progress-toggle button.active,
html[data-theme="light"] .annual-progress-toggle button[aria-pressed="true"]{background:#fff}
html[data-theme="corporate"] .annual-progress-toggle button.active,
html[data-theme="corporate"] .annual-progress-toggle button[aria-pressed="true"]{
  background:linear-gradient(135deg,#5068ec,#7c6cdc);
  color:#fff;
}
html[data-theme="corporate"] .annual-progress-panel.receipts{--progress-color:#5068ec}
html[data-theme="corporate"] .annual-progress-panel.contracting{--progress-color:#7c6cdc}
@media(max-width:720px){
  .annual-progress-header{
    align-items:stretch;
    flex-direction:column;
  }
  .annual-progress-actions{justify-content:space-between}
  .annual-progress-toggle{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  .annual-progress-toggle button{
    min-height:40px;
    font-size:13px;
  }
  .annual-progress-svg{
    width:820px;
    max-width:none;
    min-height:330px;
  }
  .annual-progress-tooltip{
    min-width:160px;
    padding:10px 11px;
  }
  .annual-progress-footnote{
    min-width:760px;
    font-size:12px;
  }
}

/* === Contracting chart easter egg === */
#annualProgressContracting .annual-progress-easter{
  display:none;
  pointer-events:none;
}
#annualProgressContracting.easter-face-on .annual-progress-point{
  display:none;
}
#annualProgressContracting.easter-face-on .annual-progress-easter{

}


/* === Pulse status-card highlight fix === */
.status-card{
  -webkit-appearance:none;
  appearance:none;
  -webkit-tap-highlight-color:transparent;
  color:inherit;
}
.status-card:focus{outline:none}
.status-card::-moz-focus-inner{border:0}
.status-card:focus-visible{
  outline:none;
  border-color:var(--acid);
}
html[data-theme="light"] .status-card,
html[data-theme="light"] .status-card:focus,
html[data-theme="light"] .status-card:active{
  background:#fffaf3;
  color:var(--text);
}
html[data-theme="light"] .status-card:hover{
  background:#fffdf9;
  color:var(--text);
  border-color:#b99e84;
}
html[data-theme="light"] .status-card:focus-visible{
  background:#fffaf3;
  color:var(--text);
  border-color:#c98b5d;
  box-shadow:0 0 0 2px rgba(184,95,43,.16), 0 8px 24px rgba(78,57,40,.05);
}



/* === Live online data layer === */
.topbar-online{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
}
.live-status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:32px;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel2);
  color:var(--muted2);
  font-size:11px;
  white-space:nowrap;
}
.live-status::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--amber);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 14%,transparent);
}
.live-status.success::before{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 14%,transparent)}
.live-status.error::before{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 14%,transparent)}
.live-refresh{
  min-height:32px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel2);
  color:var(--muted2);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.live-refresh:hover{border-color:var(--acid);color:var(--text)}
.live-refresh:disabled{opacity:.55;cursor:default}
.data-updated{
  margin-top:14px;
  color:var(--muted);
  font-size:11px;
  text-align:right;
}
.data-error{
  display:none;
  margin-bottom:12px;
  padding:12px 14px;
  border:1px solid color-mix(in srgb,var(--red) 45%,var(--line));
  border-radius:11px;
  background:color-mix(in srgb,var(--red) 8%,var(--panel));
  color:var(--red);
  font-size:12px;
  line-height:1.45;
}
.data-error.show{display:block}
.skeleton-text{color:var(--muted)}

@media(max-width:1100px){

@media(max-width:720px){
  .topbar-online{justify-content:space-between}

}
